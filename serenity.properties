serenity.project.name=SWAG LABS
serenity.test.root=com.swag.pe

# ============================================================
# DRIVER
# ============================================================
# Chrome es más común en servidores CI/Jenkins que Firefox.
# Si tu servidor Jenkins NO tiene Chrome, instálalo o usa
# una imagen Docker que lo incluya (ej: jenkins/inbound-agent).
webdriver.driver=chrome
webdriver.autodownload=true

# Chrome headless (obligatorio en servidores sin display)
chrome.switches=--headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=1920,1080

# ============================================================
# BROWSER BEHAVIOUR
# ============================================================
serenity.browser.maximized=false
serenity.use.unique.browser=false
serenity.restart.browser.each.scenario=true

# ============================================================
# APPLICATION URL
# ============================================================
# En local:  http://localhost:5173
# En Jenkins: asegúrate de que el frontend esté corriendo
#             antes de ejecutar los tests (p. ej. con docker-compose up -d)
webdriver.base.url=http://localhost:5173

# ============================================================
# SCREENSHOTS
# ============================================================
serenity.take.screenshots=FOR_EACH_ACTION

# ============================================================
# TIMEOUTS
# ============================================================
webdriver.timeouts.implicitlywait=15000
serenity.step.delay=100