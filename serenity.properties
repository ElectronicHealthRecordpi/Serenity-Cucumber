serenity.project.name=SWAG LABS
serenity.test.root=oren.example

# Driver
webdriver.driver=firefox
webdriver.autodownload=true

# Firefox headless (obligatorio en Jenkins)
firefox.switches=-headless --width=1920 --height=1080

# Browser
serenity.browser.maximized=false
serenity.use.unique.browser=false
serenity.restart.browser.each.scenario=true

# URL base de tu aplicación
webdriver.base.url=http://localhost:5173

# Screenshots en cada acción
serenity.take.screenshots=FOR_EACH_ACTION

# Timeouts (tu error actual es timeout de 2 segundos)
webdriver.timeouts.implicitlywait=10000
serenity.step.delay=300